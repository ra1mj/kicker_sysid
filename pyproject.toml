[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicker-sysid"
version = "0.1.0"
description = "Reproducible motor simulation and identification on CPU, MuJoCo and mjlab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["numpy>=2,<3", "scipy>=1.16,<2", "cmaes>=0.11,<0.14", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
mujoco = ["mujoco==3.8.1"]
mjlab = [
  "mjlab==1.3.0", "mjviser==0.0.16", "mujoco==3.8.1", "mujoco-warp==3.8.1", "warp-lang==1.12.0",
  "torch==2.7.0", "torchvision==0.22.0",
  # Declared explicitly so uv applies the official CUDA distribution sources
  # below to these otherwise transitive torch dependencies. Versions come from torch.
  "triton; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-cupti-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-nvrtc-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-runtime-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cufft-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cufile-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-curand-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusolver-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusparse-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cusparselt-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nccl-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nvjitlink-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nvtx-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
all = ["kicker-sysid[mujoco,mjlab]"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
kicker-sysid = "kicker_sysid.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires MuJoCo/mjlab", "gpu: requires CUDA"]

[tool.ruff]
line-length = 110
exclude = ["src/kicker_sysid/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/kicker_sysid"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY.md" = "kicker_sysid/THIRD_PARTY.md"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
triton = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cublas-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cuda-cupti-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cuda-nvrtc-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cuda-runtime-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cudnn-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cufft-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cufile-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-curand-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cusolver-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cusparse-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-cusparselt-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-nccl-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-nvjitlink-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
nvidia-nvtx-cu12 = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
warp-lang = [{ url = "https://github.com/NVIDIA/warp/releases/download/v1.12.0/warp_lang-1.12.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
